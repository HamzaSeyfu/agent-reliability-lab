name: Reliability Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python project
        run: pip install -e ".[dev]"

      - name: Run deterministic quality gate
        run: |
          python scripts/run_benchmark.py --check
          python scripts/run_benchmark.py --write /tmp/reliability-results.json

      - name: Run Python regression tests
        run: pytest -q

      - name: Run Promptfoo candidate evaluation
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          npx --yes promptfoo@latest eval             -c promptfooconfig.yaml             --no-cache             --output /tmp/promptfoo-results.json

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-reliability-results
          path: |
            /tmp/reliability-results.json
            /tmp/promptfoo-results.json
